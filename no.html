<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Please Annie 😭</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>
            I'm literally on my knees begging and crying for you to go to 7 Brew with me.
        </h1>

        <h2>
            You know I'll pay 💵
        </h2>

        <img
            src="begging.jpg"
            alt="Me begging Annie to go to 7 Brew"
            class="begging-photo"
        >


        <!-- ANOTHER DAY QUESTION -->

        <div id="anotherDayQuestion">

            <h2>
                Okay... how about another day?
            </h2>

            <div class="buttons">

                <button
                    type="button"
                    class="yes-button choice-button"
                    onclick="anotherDayYes()"
                >
                    YES!! 🥤☕
                </button>

                <button
                    type="button"
                    class="no-button choice-button"
                    onclick="anotherDayNo()"
                >
                    NO 😔
                </button>

            </div>

        </div>


        <!--
            ONLY SHOWS IF SHE CLICKS NO
        -->

        <div
            id="carSection"
            style="display: none;"
        >

            <img
                src="car.jpeg"
                alt="This could be us"
                class="begging-photo"
            >

            <h2>
                This could be us right now 😭
            </h2>

            <p>
                How about another day? 😂
            </p>

        </div>


        <!--
            CALENDAR
            ONLY SHOWS AFTER YES OR NO
        -->

        <div
            id="dateSection"
            style="display: none;"
        >

            <h2>
                Pick a day and time we can go to 7 Brew 🥤☕
            </h2>

            <form onsubmit="submitFuture(event)">

                <label for="date">
                    Pick a date:
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="futureTime">
                    Pick a time:
                </label>

                <input
                    type="time"
                    id="futureTime"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    "Fine, I fold you convinced me Riley!" - Annie
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>


    <!-- YES / NO CODE -->

    <script>

        function anotherDayYes() {

            // Hide YES / NO buttons
            document.getElementById("anotherDayQuestion").style.display = "none";

            // Make sure car stays hidden
            document.getElementById("carSection").style.display = "none";

            // Show calendar
            document.getElementById("dateSection").style.display = "block";
        }


        function anotherDayNo() {

            // Hide YES / NO buttons
            document.getElementById("anotherDayQuestion").style.display = "none";

            // Show car picture/message
            document.getElementById("carSection").style.display = "block";

            // Show calendar
            document.getElementById("dateSection").style.display = "block";
        }

    </script>


    <!-- GOOGLE CALENDAR CODE -->

    <script src="script.js"></script>

</body>

</html>
